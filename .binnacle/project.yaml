version: 1

project:
  id: binnacle
  name: Binnacle

tracker:
  # This repository's tickets are Markdown files under docs/specs/<slug>/issues/ (ADR-0017).
  # The GitHub remote hosts the code, not the tracker.
  provider: local
  local:
    issues: docs/specs

knowledge:
  context: CONTEXT.md
  docs: docs
  adr: docs/adr
  specs: docs/specs

workflow:
  provider: matt-pocock
  scratch: .scratch

capabilities:
  # What is installed on this machine. CLAUDE.md routes agents only to what is true here.
  serena: true
  graphify: true
  context7: true
  ast_grep: false
  obsidian: optional

automation:
  mode: manual

telemetry:
  privacy: metadata
  # A Claude Code Product session reads about 85 000 tokens in its first call; 250 000 leaves room for work (the owner, 2026-10-24).
  context_pressure:
    tokens: 250000
  # No import window: it is `binn init`'s question, and nobody has been asked it yet.
