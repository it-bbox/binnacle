# The typecheck and the offline tests, on every push to main and every pull request.
# Live tests (`pnpm test:live`) need tokens and stay out; this workflow uses no secret.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # A run takes about two minutes; a hung test stops here, not at GitHub's six hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # No version: pnpm/action-setup takes the one `packageManager` names in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
