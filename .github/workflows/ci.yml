# The typecheck and the offline tests, on every push to main and every pull request, and the
# live autostart test on each platform's runner. The tracker's live tests need tokens and stay
# out; this workflow uses no secret.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # A run takes about two minutes; a hung test stops here, not at GitHub's six hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # No version: pnpm/action-setup takes the one `packageManager` names in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  # Autostart with each runner's real service manager: systemd, launchd, Task Scheduler.
  autostart-live:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A start through the manager takes seconds; Windows waits up to a minute and a half for a restart.
    timeout-minutes: 15
    steps:
      # A hosted runner's user has no login session, so no systemd user manager; lingering gives it one.
      - if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$(id -un)"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test apps/cli/test/autostart.live.ts
