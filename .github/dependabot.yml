# npm for the whole pnpm workspace, from its root lockfile, and the workflow's actions, weekly.
# Minor and patch updates come as one pull request per ecosystem; a major one comes on its own.
# npm's cooldown is pnpm-workspace.yaml's minimumReleaseAge: change both together.
# @types/node follows the Node baseline, 24 LTS: raise its ignored range with the baseline.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "@types/node"
        versions: [">=25"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
