# npm for the whole pnpm workspace, from its root lockfile, and the workflow's actions, weekly.
# Minor and patch updates come as one pull request per ecosystem; a major one comes on its own.
# npm's cooldown is pnpm-workspace.yaml's minimumReleaseAge: change both together.
# @types/node follows the Node baseline, 24 LTS: raise its ignored range with the baseline.
# typescript: the root runs 7, apps/dashboard stays on 5.x, which vue-tsc needs. One pull request moves both
# manifests, so the root's typescript is held too. Lift the rule, and move the dashboard to 7, once vue-tsc runs on 7.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "@types/node"
        versions: [">=25"]
      - dependency-name: typescript
        versions: [">=6"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
