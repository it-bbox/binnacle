packages:
  - 'apps/*'
  - 'packages/*'

# Resolve no version younger than three days, the npm cooldown in .github/dependabot.yml.
# Dependabot runs pnpm 10 under that cooldown, which refuses any version the update resolves
# inside it, so a younger entry in the lockfile would fail every update.
minimumReleaseAge: 4320
